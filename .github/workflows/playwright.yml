name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      # ==========================================
      # Clean previous Allure data
      # ==========================================
      - name: Clean previous Allure results
        run: |
          rm -rf allure-results
          rm -rf allure-report
          mkdir -p allure-results
      # ==========================================
      # Run Playwright
      # ==========================================
      - name: Run Playwright tests
        id: playwright
        env:
          PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
        run: npx playwright test --config=playwright.service.config.js --workers=2
        continue-on-error: true
      # ==========================================
      # Upload standard Playwright report
      # ==========================================
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      # ==========================================
      # Generate Allure report
      # ==========================================
      - name: Generate Allure Report
        if: always()
        run: |
          rm -rf allure-report
          npx allure generate allure-results --clean -o allure-report
      # ==========================================
      # Upload Allure report as artifact
      # ==========================================
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30
          if-no-files-found: error
      # ==========================================
      # Deploy Allure to GitHub Pages
      # Only deploy from main
      # ==========================================
      - name: Deploy Allure Report to GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          force_orphan: true